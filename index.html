<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera Recorder</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: #f4f4f5; color: #18181b; }
  main { max-width: 720px; margin: 24px auto; padding: 0 16px; }
  /* Mirror the on-screen preview only, like FaceTime. The saved video is not flipped. */
  video { width: 100%; background: #000; border-radius: 8px; transform: scaleX(-1); }
  .row { display: flex; gap: 12px; margin-top: 12px; }
  label, .field { display: flex; flex-direction: column; font-size: 13px; color: #52525b; flex: 1; }
  input { font-size: 16px; padding: 8px; border: 1px solid #d4d4d8; border-radius: 6px; margin-top: 4px; }
  button { font-size: 18px; padding: 12px; border: 0; border-radius: 8px; color: #fff; background: #16a34a; cursor: pointer; width: 100%; margin-top: 16px; }
  button.recording { background: #dc2626; }
  button:disabled { background: #a1a1aa; cursor: default; }
  #name { font-family: ui-monospace, monospace; margin-top: 12px; }
  #status { margin-top: 12px; min-height: 1.4em; }
  #saved-path { color: #15803d; overflow-wrap: anywhere; }
  .error { color: #dc2626; }
  .ok { color: #16a34a; }
  #minutes { width: 80px; }
  .folder-row { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
  #folder { font-family: ui-monospace, monospace; font-size: 14px; color: #18181b; flex: 1; word-break: break-all; }
  button.small { font-size: 14px; padding: 6px 12px; width: auto; margin-top: 0; background: #52525b; }
</style>
</head>
<body>
<main>
  <video id="preview" autoplay muted playsinline></video>

  <div class="row">
    <label>Dyad ID <input id="pid" placeholder="111"></label>
    <label style="flex: 0">Minutes <input id="minutes" type="number" min="1" value="10"></label>
  </div>
  <div class="row">
    <div class="field">Save folder (on ResearchDrive)
      <div class="folder-row"><span id="folder"></span><button class="small" id="choose">Change…</button></div>
    </div>
  </div>

  <div id="name"></div>
  <button id="btn" disabled>Start recording</button>
  <div id="status"></div>
  <a id="saved-path" href="#" hidden></a>
</main>

<script>
const $ = (id) => document.getElementById(id);
const preview = $("preview"), btn = $("btn"), status = $("status");
let stream, recorder, chunks = [], startedAt, timer, limitMs, recordingName, recordingFolder;

// Pick an .mp4 format the browser can record (Safari and Chrome can; Firefox can't).
const mimeType = ["video/mp4;codecs=avc1,mp4a.40.2", "video/mp4"].find((t) => MediaRecorder.isTypeSupported(t));

// Remember the save folder between visits.
let folder = (window.cameraApp?.platform === "win32" || navigator.userAgent.includes("Windows"))
  ? "\\\\research.drive.wisc.edu\\niedenthal\\UW_Fall2026" : "/Volumes/niedenthal/UW_Fall2026";
try { folder = localStorage.getItem("folder") || folder; } catch {}
$("folder").textContent = folder;

// Opens Finder (Mac) or Explorer (Windows) to pick the save folder: through the
// desktop app if running in it, otherwise through server.py.
$("choose").onclick = async () => {
  $("choose").disabled = true;
  setStatus("Pick a folder in the window that just opened…");
  try {
    let message;
    if (window.cameraApp) {
      message = await window.cameraApp.chooseFolder(folder);
    } else {
      const res = await fetch("/choose-folder?path=" + encodeURIComponent(folder));
      message = (await res.json()).message;
      if (!res.ok) throw new Error(message);
    }
    setStatus("");
    if (message) {
      folder = message;
      $("folder").textContent = folder;
      try { localStorage.setItem("folder", folder); } catch {}
    }
  } catch (e) {
    setStatus("Can't use that folder: " + e.message, "error");
  }
  $("choose").disabled = false;
};

// Time stamp like 09282026-034200 (mmddyyyy-hhmmss).
function stamp(t) {
  const d = new Date(t);
  const p = (n) => String(n).padStart(2, "0");
  return `${p(d.getMonth() + 1)}${p(d.getDate())}${d.getFullYear()}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}

// e.g. dyad-111_09282026-034200. Uses the time recording started.
function fileName(t = startedAt) {
  const pid = $("pid").value.trim();
  if (!pid) return "";
  return `dyad-${pid}_${stamp(t)}`;
}

function showName() {
  const n = fileName(Date.now());
  $("name").textContent = n ? `Will save as: ${n}.mp4 (time = when you press Start)` : "";
}
$("pid").addEventListener("input", showName);
showName();

function setStatus(msg, cls = "") {
  status.textContent = msg; status.className = cls;
  $("saved-path").hidden = true;
}

function showSaved(prefix, savedPath, cls = "ok") {
  setStatus(prefix, cls);
  const link = $("saved-path");
  link.textContent = savedPath;
  link.hidden = false;
  link.title = "Show recording in Finder or File Explorer";
  link.onclick = async (event) => {
    event.preventDefault();
    try {
      if (window.cameraApp) await window.cameraApp.revealRecording(savedPath);
      else {
        const res = await fetch("/reveal", { method: "POST", headers: { "X-Path": encodeURIComponent(savedPath) } });
        if (!res.ok) throw new Error((await res.json()).message);
      }
    } catch (error) {
      status.textContent = "Could not show recording: " + error.message;
      status.className = "error";
    }
  };
}

async function init() {
  if (!mimeType) return setStatus("This browser can't record .mp4. Please use Chrome or Safari.", "error");
  try {
    // Ask for 16:9 HD (1080p, or 720p if the camera can't do 1080p).
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1920 }, height: { ideal: 1080 }, aspectRatio: { ideal: 16 / 9 } },
      audio: true,
    });
    preview.srcObject = stream;
    btn.disabled = false;
  } catch (e) {
    setStatus("Could not open camera: " + e.message, "error");
  }
}

btn.onclick = () => (recorder && recorder.state === "recording" ? stop() : start());

const clock = (s) => (s = Math.round(s), `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`);

function start() {
  if (!$("pid").value.trim()) return setStatus("Enter the dyad ID first.", "error");
  if (!/^[A-Za-z0-9_-]+$/.test($("pid").value.trim())) return setStatus("Dyad ID can only contain letters, numbers, - and _.", "error");
  const minutes = Number($("minutes").value);
  if (!Number.isFinite(minutes) || !(minutes > 0)) return setStatus("Enter how many minutes to record.", "error");
  limitMs = minutes * 60_000;
  chunks = [];
  recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8_000_000, audioBitsPerSecond: 128_000 });
  recorder.ondataavailable = (e) => {
    if (e.data.size) chunks.push(e.data);
    // Also checked here, since browsers slow down timers in background tabs.
    if (Date.now() - startedAt >= limitMs) stop();
  };
  recorder.onstop = upload;
  recorder.start(1000);
  startedAt = Date.now();
  recordingName = fileName();
  recordingFolder = folder;
  $("pid").disabled = $("minutes").disabled = $("choose").disabled = true;
  btn.textContent = "Stop recording";
  btn.classList.add("recording");
  timer = setInterval(() => {
    const ms = Date.now() - startedAt;
    if (ms >= limitMs) return stop();
    setStatus(`Recording… ${clock(Math.floor(ms / 1000))} of ${clock(limitMs / 1000)} (stops and saves automatically)`);
  }, 250);
}

function stop() {
  if (!recorder || recorder.state !== "recording") return;
  btn.disabled = true;
  clearInterval(timer);
  recorder.stop();
  btn.textContent = "Start recording";
  btn.classList.remove("recording");
}

async function upload() {
  btn.disabled = true;
  setStatus("Saving to ResearchDrive…");
  const blob = new Blob(chunks, { type: "video/mp4" });
  try {
    if (window.cameraApp) {
      const savedPath = await window.cameraApp.saveRecording(
        recordingFolder,
        recordingName,
        await blob.arrayBuffer(),
      );
      showSaved("Saved:", savedPath);
    } else {
      const res = await fetch("/save", {
        method: "POST",
        headers: {
          "X-Folder": encodeURIComponent(recordingFolder),
          "X-Filename": encodeURIComponent(recordingName),
        },
        body: blob,
      });
      const { message } = await res.json();
      if (res.ok) showSaved("Saved:", message);
      else throw new Error(message);
    }
  } catch (e) {
    // Keep a local copy so a ResearchDrive outage never loses a recording.
    try {
      if (window.cameraApp) {
        const fallbackPath = await window.cameraApp.saveFallback(recordingName, await blob.arrayBuffer());
        showSaved(`ResearchDrive save failed: ${e.message} Local copy saved:`, fallbackPath, "error");
      } else {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = recordingName + ".mp4";
        a.click();
        setStatus("Upload failed: " + e.message + " — a copy was downloaded to your Downloads folder.", "error");
      }
    } catch (fallbackError) {
      setStatus(`Save failed: ${e.message} Local backup also failed: ${fallbackError.message}`, "error");
      btn.textContent = "Retry saving";
      btn.onclick = upload;
      btn.disabled = false;
      return;
    }
  }
  btn.disabled = false;
  btn.textContent = "Start recording";
  btn.onclick = () => (recorder && recorder.state === "recording" ? stop() : start());
  $("pid").disabled = $("minutes").disabled = $("choose").disabled = false;
  chunks = [];
}

init();
</script>
</body>
</html>
